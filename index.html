<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --fg: #1a1c1e; --muted: #5c6166;
    --line: #e3e6e8; --accent: #1f6feb; --card: #f6f8fa;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171a; --fg: #e8eaed; --muted: #9aa1a8;
            --line: #2c3237; --accent: #6ea8ff; --card: #1c2126; }

  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 3rem 1.25rem 5rem;

  ul { list-style: none; padding: 0; margin: 0; }
  li { margin-bottom: 0.75rem; }
  a.card {
    display: block; padding: 1rem 1.15rem;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; text-decoration: none; color: var(--fg);
  }
  a.card:hover { border-color: var(--accent); }
  a.card strong { display: block; color: var(--accent); margin-bottom: 0.15rem; }
  a.card span { color: var(--muted); font-size: 0.92rem; }
  footer { margin-top: 3rem; color: var(--muted); font-size: 0.9rem; }
